        window.ormBuilder = {
            exportExtensionSourceHandle: null,
            exportExtensionDestinationHandle: null,

            },

                return "showDirectoryPicker" in window;
            },
            supportsOpenFilePicker: function () {
                return "showOpenFilePicker" in window;
            },
            selectExportExtensionSourceFolder: async function () {
                if (!("showDirectoryPicker" in window)) {
                    return {
                        success: false,
                        isEmpty: false,
                        directoryName: "",
                        errorMessage: "The browser does not allow selecting folders."
                    };
                }

                try {
                    const directoryHandle = await window.showDirectoryPicker();
                    window.ormBuilder.exportExtensionSourceHandle = directoryHandle;

                    return {
                        success: true,
                        isEmpty: false,
                        directoryName: directoryHandle && directoryHandle.name ? directoryHandle.name : "",
                        errorMessage: ""
                    };
                } catch (error) {
                    if (error && error.name === "AbortError") {
                        return {
                            success: false,
                            isEmpty: false,
                            directoryName: "",
                            errorMessage: ""
                        };
                    }

                    return {
                        success: false,
                        isEmpty: false,
                        directoryName: "",
                        errorMessage: "Could not select the source folder."
                    };
                }
            },
            selectExportExtensionDestinationFolder: async function () {
                if (!("showDirectoryPicker" in window)) {
                    return {
                        success: false,
                        isEmpty: false,
                        directoryName: "",
                        errorMessage: "The browser does not allow selecting folders."
                    };
                }

                const ensureReadWritePermission = async (directoryHandle) => {
                    const descriptor = { mode: "readwrite" };

                    if (typeof directoryHandle.queryPermission === "function") {
                        const currentPermission = await directoryHandle.queryPermission(descriptor);
                        if (currentPermission === "granted") {
                            return true;
                        }
                    }

                    if (typeof directoryHandle.requestPermission === "function") {
                        const requestedPermission = await directoryHandle.requestPermission(descriptor);
                        return requestedPermission === "granted";
                    }

                    return false;
                };

                const isDirectoryEmpty = async (directoryHandle) => {
                    for await (const _entry of directoryHandle.values()) {
                        return false;
                    }

                    return true;
                };

                try {
                    const directoryHandle = await window.showDirectoryPicker();
                    const hasPermission = await ensureReadWritePermission(directoryHandle);
                    if (!hasPermission) {
                        return {
                            success: false,
                            isEmpty: false,
                            directoryName: "",
                            errorMessage: "Read/write permissions were not granted for the destination folder."
                        };
                    }

                    const isEmpty = await isDirectoryEmpty(directoryHandle);
                    window.ormBuilder.exportExtensionDestinationHandle = directoryHandle;

                    return {
                        success: true,
                        isEmpty: isEmpty,
                        directoryName: directoryHandle && directoryHandle.name ? directoryHandle.name : "",
                        errorMessage: ""
                    };
                } catch (error) {
                    if (error && error.name === "AbortError") {
                        return {
                            success: false,
                            isEmpty: false,
                            directoryName: "",
                            errorMessage: ""
                        };
                    }

                    return {
                        success: false,
                        isEmpty: false,
                        directoryName: "",
                        errorMessage: "Could not select the destination folder."
                    };
                }
            },
            selectExportExtensionSourceFile: async function () {
                if (!("showOpenFilePicker" in window)) {
                    return {
                        success: false,
                        fileName: "",
                        errorMessage: "The browser does not allow selecting files."
                    };
                }

                try {
                    const pickerResult = await window.showOpenFilePicker({
                        multiple: false,
                        types: [
                            {
                                description: "Images",
                                accept: {
                                    "image/*": [".png", ".webp"]
                                }
                            }
                        ]
                    });

                    if (!pickerResult || !pickerResult.length) {
                        return {
                            success: false,
                            fileName: "",
                            errorMessage: ""
                        };
                    }

                    const fileHandle = pickerResult[0];
                    window.ormBuilder.exportExtensionSourceFileHandle = fileHandle;

                    return {
                        success: true,
                        fileName: fileHandle && fileHandle.name ? fileHandle.name : "",
                        errorMessage: ""
                    };
                } catch (error) {
                    if (error && error.name === "AbortError") {
                        return {
                            success: false,
                            fileName: "",
                            errorMessage: ""
                        };
                    }

                    return {
                        success: false,
                        fileName: "",
                        errorMessage: "Could not select the source file."
                    };
                }
            },
            processExportExtensionFolder: async function (targetExtension, webpQuality) {
                if (!("showDirectoryPicker" in window)) {
                    return {
                        success: false,
                        errorMessage: "The browser does not allow selecting folders.",
                        totalCandidates: 0,
                        processedCount: 0,
                        skippedCount: 0,
                        errors: []
                    };
                }

                const result = {
                    success: true,
                    errorMessage: "",
                    totalCandidates: 0,
                    processedCount: 0,
                    skippedCount: 0,
                    errors: []
                };

                const sourceDirHandle = window.ormBuilder.exportExtensionSourceHandle;
                const destinationDirHandle = window.ormBuilder.exportExtensionDestinationHandle;

                if (!sourceDirHandle) {
                    return {
                        success: false,
                        errorMessage: "You must select a source folder.",
                        totalCandidates: 0,
                        processedCount: 0,
                        skippedCount: 0,
                        errors: []
                    };
                }

                if (!destinationDirHandle) {
                    return {
                        success: false,
                        errorMessage: "You must select a destination folder.",
                        totalCandidates: 0,
                        processedCount: 0,
                        skippedCount: 0,
                        errors: []
                    };
                }

                const extension = String(targetExtension || "").toLowerCase();
                if (extension !== "png" && extension !== "webp") {
                    return {
                        success: false,
                        errorMessage: "The output extension is not valid.",
                        totalCandidates: 0,
                        processedCount: 0,
                        skippedCount: 0,
                        errors: []
                    };
                }

                const ensureReadWritePermission = async (directoryHandle) => {
                    const descriptor = { mode: "readwrite" };

                    if (typeof directoryHandle.queryPermission === "function") {
                        const currentPermission = await directoryHandle.queryPermission(descriptor);
                        if (currentPermission === "granted") {
                            return true;
                        }
                    }

                    if (typeof directoryHandle.requestPermission === "function") {
                        const requestedPermission = await directoryHandle.requestPermission(descriptor);
                        return requestedPermission === "granted";
                    }

                    return false;
                };

                const isDirectoryEmpty = async (directoryHandle) => {
                    for await (const _entry of directoryHandle.values()) {
                        return false;
                    }

                    return true;
                };

                const hasDestinationPermission = await ensureReadWritePermission(destinationDirHandle);
                if (!hasDestinationPermission) {
                    return {
                        success: false,
                        errorMessage: "Write permissions were not granted for the destination folder.",
                        totalCandidates: 0,
                        processedCount: 0,
                        skippedCount: 0,
                        errors: []
                    };
                }

                const destinationIsEmpty = await isDirectoryEmpty(destinationDirHandle);
                if (!destinationIsEmpty) {
                    return {
                        success: false,
                        errorMessage: "The destination folder must be empty.",
                        totalCandidates: 0,
                        processedCount: 0,
                        skippedCount: 0,
                        errors: []
                    };
                }

                const sourceExtension = extension === "webp" ? "png" : "webp";
                const sourceSuffix = "." + sourceExtension;

                const safeWebpQuality = Number.isFinite(webpQuality)
                    ? Math.min(1, Math.max(0.01, webpQuality))
                    : 0.8;

                const loadImageFromFile = (file) => new Promise((resolve, reject) => {
                    const objectUrl = URL.createObjectURL(file);
                    const image = new Image();
                    image.onload = () => {
                        URL.revokeObjectURL(objectUrl);
                        resolve(image);
                    };
                    image.onerror = () => {
                        URL.revokeObjectURL(objectUrl);
                        reject(new Error("Could not decode an image."));
                    };
                    image.src = objectUrl;
                });

                const encodeImageFile = async (file, outputExtension, outputQuality) => {
                    const image = await loadImageFromFile(file);
                    const canvas = document.createElement("canvas");
                    canvas.width = image.width;
                    canvas.height = image.height;

                    const context = canvas.getContext("2d");
                    if (!context) {
                        throw new Error("Could not create the canvas context.");
                    }

                    context.drawImage(image, 0, 0, image.width, image.height);

                    const mimeType = outputExtension === "webp" ? "image/webp" : "image/png";

                    return new Promise((resolve, reject) => {
                        const onBlobReady = (blob) => {
                            if (!blob) {
                                reject(new Error("Could not encode the output image."));
                                return;
                            }

                            resolve(blob);
                        };

                        if (mimeType === "image/webp") {
                            canvas.toBlob(onBlobReady, mimeType, outputQuality);
                            return;
                        }

                        canvas.toBlob(onBlobReady, mimeType);
                    });
                };

                const createDestinationFile = async (folderHandle, fileName, blob) => {
                    const fileHandle = await folderHandle.getFileHandle(fileName, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                };

                try {
                    for await (const entry of sourceDirHandle.values()) {
                        if (entry.kind !== "file") {
                            continue;
                        }

                        if (!entry.name.toLowerCase().endsWith(sourceSuffix)) {
                            continue;
                        }

                        result.totalCandidates += 1;

                        try {
                            const sourceFile = await entry.getFile();
                            const outputBlob = await encodeImageFile(sourceFile, extension, safeWebpQuality);

                            const baseName = entry.name.substring(0, entry.name.length - sourceSuffix.length);
                            const outputName = `${baseName}.${extension}`;

                            await createDestinationFile(destinationDirHandle, outputName, outputBlob);
                            result.processedCount += 1;
                        } catch (error) {
                            result.skippedCount += 1;
                            result.errors.push(`Skipped file ${entry.name}: ${error && error.message ? error.message : "Unknown error."}`);
                        }
                    }

                    if (result.totalCandidates === 0) {
                        result.success = false;
                        result.errorMessage = `No .${sourceExtension} files were found to convert.`;
                    }

                    return result;
                } catch (error) {
                    if (error && error.name === "AbortError") {
                        return {
                            success: false,
                            errorMessage: "Operation canceled by user.",
                            totalCandidates: 0,
                            processedCount: 0,
                            skippedCount: 0,
                            errors: []
                        };
                    }

                    const errorName = error && error.name ? error.name : "Error";
                    const errorDetails = error && error.message ? error.message : "No details.";

                    return {
                        success: false,
                        errorMessage: `Could not complete the export (${errorName}: ${errorDetails}).`,
                        totalCandidates: 0,
                        processedCount: 0,
                        skippedCount: 0,
                        errors: []
                    };
                }
            },
            processExportExtensionFile: async function (targetExtension, webpQuality) {
                if (!("showDirectoryPicker" in window)) {
                    return {
                        success: false,
                        errorMessage: "The browser does not allow selecting folders.",
                        totalCandidates: 0,
                        processedCount: 0,
                        skippedCount: 0,
                        errors: []
                    };
                }

                const result = {
                    success: true,
                    errorMessage: "",
                    totalCandidates: 1,
                    processedCount: 0,
                    skippedCount: 0,
                    errors: []
                };

                const sourceFileHandle = window.ormBuilder.exportExtensionSourceFileHandle;
                const destinationDirHandle = window.ormBuilder.exportExtensionDestinationHandle;

                if (!sourceFileHandle) {
                    return {
                        success: false,
                        errorMessage: "You must select a source file.",
                        totalCandidates: 0,
                        processedCount: 0,
                        skippedCount: 0,
                        errors: []
                    };
                }

                if (!destinationDirHandle) {
                    return {
                        success: false,
                        errorMessage: "You must select a destination folder.",
                        totalCandidates: 0,
                        processedCount: 0,
                        skippedCount: 0,

                    };
                }

                const extension = String(targetExtension || "").toLowerCase();
                if (extension !== "png" && extension !== "webp") {
                    return {
                        success: false,
                        errorMessage: "The output extension is not valid.",
                        totalCandidates: 0,

                    };
                }

                const ensureReadWritePermission = async (directoryHandle) => {
                    const descriptor = { mode: "readwrite" };

                    if (typeof directoryHandle.queryPermission === "function") {
                        const currentPermission = await directoryHandle.queryPermission(descriptor);
                        if (currentPermission === "granted") {
                            return true;
                        }
                    }

                    if (typeof directoryHandle.requestPermission === "function") {
                        const requestedPermission = await directoryHandle.requestPermission(descriptor);
                        return requestedPermission === "granted";
                    }

                    return false;
                };

                const isDirectoryEmpty = async (directoryHandle) => {
                    for await (const _entry of directoryHandle.values()) {
                        return false;
                    }

                    return true;
                };

                const loadImageFromFile = (file) => new Promise((resolve, reject) => {
                    const objectUrl = URL.createObjectURL(file);
                    const image = new Image();
                    image.onload = () => {
                        URL.revokeObjectURL(objectUrl);
                        resolve(image);
                    };
                    image.onerror = () => {
                        URL.revokeObjectURL(objectUrl);
                        reject(new Error("Could not decode the image."));
                    };
                    image.src = objectUrl;
                });

                const encodeImageFile = async (file, outputExtension, outputQuality) => {
                    const image = await loadImageFromFile(file);
                    const canvas = document.createElement("canvas");
                    canvas.width = image.width;
                    canvas.height = image.height;

                    const context = canvas.getContext("2d");
                    if (!context) {
                        throw new Error("Could not create the canvas context.");
                    }

                    context.drawImage(image, 0, 0, image.width, image.height);

                    const mimeType = outputExtension === "webp" ? "image/webp" : "image/png";

                    return new Promise((resolve, reject) => {
                        const onBlobReady = (blob) => {
                            if (!blob) {
                                reject(new Error("Could not encode the output image."));
                                return;
                            }

                            resolve(blob);
                        };

                        if (mimeType === "image/webp") {
                            canvas.toBlob(onBlobReady, mimeType, outputQuality);
                            return;
                        }

                        canvas.toBlob(onBlobReady, mimeType);
                    });

                const createDestinationFile = async (folderHandle, fileName, blob) => {
                    const fileHandle = await folderHandle.getFileHandle(fileName, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                };

                const sourceSuffix = extension === "webp" ? ".png" : ".webp";
                const safeWebpQuality = Number.isFinite(webpQuality)
                    ? Math.min(1, Math.max(0.01, webpQuality))
                    : 0.8;

                try {
                    const hasDestinationPermission = await ensureReadWritePermission(destinationDirHandle);
                    if (!hasDestinationPermission) {
                        return {
                            success: false,
                            errorMessage: "Write permissions were not granted for the destination folder.",
                            totalCandidates: 0,
                            processedCount: 0,
                            skippedCount: 0,
                            errors: []
                        };
                    }

                    const sourceFile = await sourceFileHandle.getFile();
                    const lowerName = sourceFile.name.toLowerCase();

                    if (!lowerName.endsWith(sourceSuffix)) {
                        return {
                            success: false,
                            errorMessage: `The source file must be ${sourceSuffix} to export to .${extension}.`,
                            totalCandidates: 1,
                            processedCount: 0,
                            skippedCount: 1,
                            errors: []
                        };
                    }

                    const outputBlob = await encodeImageFile(sourceFile, extension, safeWebpQuality);
                    const baseName = sourceFile.name.substring(0, sourceFile.name.length - sourceSuffix.length);
                    const outputName = `${baseName}.${extension}`;

                    await createDestinationFile(destinationDirHandle, outputName, outputBlob);
                    result.processedCount = 1;
                    return result;
                } catch (error) {
                    if (error && error.name === "AbortError") {
                        return {
                            success: false,
                            errorMessage: "Operation canceled by user.",
                            totalCandidates: 1,

                    }

                        totalCandidates: 1,
                        processedCount: 0,
                        skippedCount: 1,
                        errors: []
                    };
                }
            },
            findAndLoadCompanionMaps: async function (aoFileName) {
                const parseMapName = (fileName) => {
                    const dotIndex = fileName.lastIndexOf(".");
                    const name = dotIndex >= 0 ? fileName.substring(0, dotIndex) : fileName;
                    const match = name.match(/^(.*)_([^_]+)$/);
                    if (!match) {
                        return null;
                    }

                    return {
                        baseName: match[1],
                        type: match[2].toLowerCase()
                    };
                };

                const toDataUrl = (file) => new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => reject(new Error("Could not read a file."));
                    reader.readAsDataURL(file);
                });

                if (!("showDirectoryPicker" in window)) {
                    return {
                        success: false,
                        errorMessage: "The browser does not allow automatically reading files from a folder."
                    };
                }

                const parsedAo = parseMapName(aoFileName);
                if (!parsedAo || parsedAo.type !== "ao") {
                    return {
                        success: false,
                        errorMessage: "The first file must use the _AO suffix."
                    };
                }

                try {

            createOrm: async function (aoSrc, roughnessSrc, metallicSrc) {

            createMapsFromDiffuse: async function (diffuseSrc, aoStrength, roughnessContrast, metallicThreshold, metallicIntensity, normalStrength) {
                const clamp01 = (value) => Math.min(1, Math.max(0, value));

                const safeAoStrength = Number.isFinite(aoStrength) ? Math.max(0, aoStrength) : 1.0;

                const height = diffuse.height;

                sourceCanvas.width = width;
                sourceCanvas.height = height;

                const source = sourceCtx.getImageData(0, 0, width, height).data;

                    const canvas = document.createElement("canvas");
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext("2d");
                    if (!ctx) {
                        throw new Error("Could not create a canvas for generated maps.");
                    }

                    const imageData = ctx.createImageData(width, height);
                    for (let i = 0; i < source.length; i += 4) {
                        const r = source[i] / 255;
                        const g = source[i + 1] / 255;
                        const b = source[i + 2] / 255;

                        const linearR = Math.pow(r, 2.2);
                        const linearG = Math.pow(g, 2.2);
                        const linearB = Math.pow(b, 2.2);
                        const luminance = (0.2126 * linearR) + (0.7152 * linearG) + (0.0722 * linearB);

                        const value = clamp01(channelSelector(luminance, linearR, linearG, linearB));
                        const encoded = Math.round(value * 255);

                        imageData.data[i] = encoded;
                        imageData.data[i + 1] = encoded;
                        imageData.data[i + 2] = encoded;
                        imageData.data[i + 3] = 255;
                    }

                    ctx.putImageData(imageData, 0, 0);
                    return canvas.toDataURL("image/png");
                };

                    const baseAo = 0.45 + (luminance * 0.55);
                    return 1 - ((1 - baseAo) * safeAoStrength);
                });

                const roughness = makeSingleChannelMap((luminance) => {
                    const baseRoughness = 0.85 - (luminance * 0.7);
                    return ((baseRoughness - 0.5) * safeRoughnessContrast) + 0.5;
                });

                const metallic = makeSingleChannelMap((luminance) => {
                    if (luminance <= safeMetallicThreshold) {
                        return 0;
                    }

                    const range = Math.max(0.0001, 1 - safeMetallicThreshold);
                    const normalized = (luminance - safeMetallicThreshold) / range;
                    return Math.pow(normalized, 1.5) * safeMetallicIntensity;

                const normalCanvas = document.createElement("canvas");
                normalCanvas.width = width;
                normalCanvas.height = height;

                const normalCtx = normalCanvas.getContext("2d");
                if (!normalCtx) {
                    throw new Error("Could not create a canvas for the normal map.");
                }

                const getLuminance = (x, y) => {
                    const clampedX = Math.max(0, Math.min(width - 1, x));
                    const clampedY = Math.max(0, Math.min(height - 1, y));
                    const index = (clampedY * width + clampedX) * 4;

                    const r = source[index] / 255;
                    const g = source[index + 1] / 255;
                    const b = source[index + 2] / 255;

                    const linearR = Math.pow(r, 2.2);
                    const linearG = Math.pow(g, 2.2);
                    const linearB = Math.pow(b, 2.2);

                        const right = getLuminance(x + 1, y);
                        const up = getLuminance(x, y - 1);
                        const down = getLuminance(x, y + 1);

                        const dx = (left - right) * safeNormalStrength;
                        const dy = (up - down) * safeNormalStrength;
                        const dz = 1.0;

                        const length = Math.sqrt((dx * dx) + (dy * dy) + (dz * dz)) || 1.0;
                        const nx = dx / length;
                        const ny = dy / length;
                        const nz = dz / length;

                        const pixel = (y * width + x) * 4;
                        normalImageData.data[pixel] = Math.round((nx * 0.5 + 0.5) * 255);
                        normalImageData.data[pixel + 1] = Math.round((ny * 0.5 + 0.5) * 255);
                        normalImageData.data[pixel + 2] = Math.round((nz * 0.5 + 0.5) * 255);
                        normalImageData.data[pixel + 3] = 255;
                    }
                }

                normalCtx.putImageData(normalImageData, 0, 0);
                const normal = normalCanvas.toDataURL("image/png");

                return {
                    ao: ao,
                    roughness: roughness,
                    metallic: metallic,
                    normal: normal
                };
